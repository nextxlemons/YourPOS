{% extends "base.html" %}
{% block title %}Login{% endblock title %}
{% block body %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card bg-body-secondary text-dark shadow-lg" style="width: 100%; max-width: 420px;">
        <div class="card-body p-4">
            <h4 class="fw-bold text-center mb-4">Login to YourPOS</h4>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Your username" required autofocus>
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Your password" required>
                </div>

                <button type="submit" class="btn btn-dark w-100">Log In</button>
            </form>

            <p class="text-center mt-3 mb-0">
                Don't have an account? <a href="{% url 'signup' %}">Sign up</a>
            </p>
        </div>
    </div>
</div>
{% endblock body %}
