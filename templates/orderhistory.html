{% extends "base.html" %}
{% block title %}Order History{% endblock title %}
{% block body %}

<hr class="border border-light border-1">
<div class="container-fluid d-flex justify-content-between align-items-center px-4">
    <h5>Order History</h5>
    <a class="btn btn-light" href="/salesreport/">Sales Report</a>
</div>
<hr class="border border-white border-1">

<div class="container-fluid px-4">
    <table class="table table-primary table-bordered table-striped">
        <thead><tr><th>Bill No</th><th>Table</th><th>Amount</th><th>Items</th><th>Payment</th><th>Date</th><th>Time</th><th>Note</th></tr></thead>
        <tbody id="bill-rows"></tbody>
    </table>
</div>

<script>
const CSRF_TOKEN = "{{ csrf_token }}";

function apiGet(url) {
    return fetch(url, { headers: { 'X-CSRFToken': CSRF_TOKEN } }).then(r => r.json());
}

function formatDate(isoString) {
    const d = new Date(isoString);
    const pad = n => String(n).padStart(2, '0');
    return {
        date: `${pad(d.getDate())}-${pad(d.getMonth() + 1)}-${d.getFullYear()}`,
        time: `${pad(d.getHours())}:${pad(d.getMinutes())}`,
    };
}

function renderOrderHistory(bills) {
    const tbody = document.getElementById('bill-rows');
    tbody.innerHTML = "";

    if (bills.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center text-muted">No bills yet</td></tr>`;
        return;
    }

    bills.forEach(bill => {
        const { date, time } = formatDate(bill.created_at);
        tbody.innerHTML += `
            <tr>
                <td>${bill.bill_number}</td>
                <td>${bill.table_no}</td>
                <td>₹${bill.total_amount}</td>
                <td>${bill.items_summary}</td>
                <td>${bill.payment_method_display}</td>
                <td>${date}</td>
                <td>${time}</td>
                <td>${bill.note || "—"}</td>
            </tr>`;
    });
}

function loadOrderHistory() {
    apiGet('/api/bills/').then(data => renderOrderHistory(data.results || data));
}

loadOrderHistory();
</script>
{% endblock body %}
