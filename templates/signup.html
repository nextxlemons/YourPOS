{% extends "base.html" %}
{% block title %}Sign Up{% endblock title %}
{% block body %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card bg-body-secondary text-dark shadow-lg" style="width: 100%; max-width: 420px;">
        <div class="card-body p-4">
            <h4 class="fw-bold text-center mb-4">Create Your Café Account</h4>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Café Name</label>
                    <input type="text" name="cafe_name" class="form-control" placeholder="e.g. Brew Corner" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="you@example.com">
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Create a password" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
                </div>

                <button type="submit" class="btn btn-dark w-100">Sign Up</button>
            </form>

            <p class="text-center mt-3 mb-0">
                Already have an account? <a href="{% url 'login' %}">Log in</a>
            </p>
        </div>
    </div>
</div>
{% endblock body %}
