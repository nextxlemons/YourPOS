{% extends "base.html" %}
{% block title %}Dashboard{% endblock title %}
{% block body %}

<hr class="border border-light border-1">
<div class="container-fluid d-flex justify-content-between align-items-center px-4">
    <h5>Home</h5>
</div>
<hr class="border border-white border-1">

<div class="container-fluid px-4">

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card bg-body-secondary text-dark h-100">
                <div class="card-body text-center">
                    <h6 class="text-muted mb-1">Today's Sales</h6>
                    <h3 class="fw-bold text-success" id="today-total">₹0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-body-secondary text-dark h-100">
                <div class="card-body text-center">
                    <h6 class="text-muted mb-1">Bills Settled Today</h6>
                    <h3 class="fw-bold text-primary" id="today-count">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-body-secondary text-dark h-100">
                <div class="card-body text-center">
                    <h6 class="text-muted mb-1">Tables Occupied</h6>
                    <h3 class="fw-bold text-danger" id="occupied-ratio">0 / 0</h3>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3">

        <!-- Recent Settled Bill -->
        <div class="col-md-6">
            <div class="card bg-body-secondary text-dark h-100">
                <div class="card-header fw-semibold">Most Recent Bill</div>
                <div class="card-body" id="recent-bill-body">
                    <p class="text-muted mb-0">Loading...</p>
                </div>
                <div class="card-footer text-end">
                    <a href="/orderhistory/" class="btn btn-sm btn-outline-dark">View Full History</a>
                </div>
            </div>
        </div>

        <!-- Occupied Tables -->
        <div class="col-md-6">
            <div class="card bg-body-secondary text-dark h-100">
                <div class="card-header fw-semibold">Occupied Tables</div>
                <div class="card-body" id="occupied-tables-body">
                    <p class="text-muted mb-0">Loading...</p>
                </div>
                <div class="card-footer text-end">
                    <a href="/orders/" class="btn btn-sm btn-outline-dark">View All Tables</a>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
const CSRF_TOKEN = "{{ csrf_token }}";

function apiGet(url) {
    return fetch(url, { headers: { 'X-CSRFToken': CSRF_TOKEN } }).then(r => r.json());
}

function formatDateTime(isoString) {
    const d = new Date(isoString);
    const pad = n => String(n).padStart(2, '0');
    return `${pad(d.getDate())}-${pad(d.getMonth() + 1)}-${d.getFullYear()} at ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// Today's sales + bill count
apiGet('/api/reports/sales/').then(data => {
    document.getElementById('today-total').innerText = `₹${data.daily.total || 0}`;
    document.getElementById('today-count').innerText = data.daily.count || 0;
});

// Tables: occupied count + occupied table buttons
apiGet('/api/tables/').then(data => {
    const tables = data.results || data;
    const occupied = tables.filter(t => t.status === 'O');

    document.getElementById('occupied-ratio').innerText = `${occupied.length} / ${tables.length}`;

    const body = document.getElementById('occupied-tables-body');
    if (occupied.length === 0) {
        body.innerHTML = `<p class="text-muted mb-0">All tables are available.</p>`;
    } else {
        body.innerHTML = `<div class="d-flex flex-wrap gap-2">` +
            occupied.map(t => `<a href="/createorders/${t.id}/" class="btn btn-outline-danger btn-sm">Table ${t.table_no}</a>`).join("") +
            `</div>`;
    }
});

// Most recent bill
apiGet('/api/bills/').then(data => {
    const bills = data.results || data;
    const body = document.getElementById('recent-bill-body');

    if (bills.length === 0) {
        body.innerHTML = `<p class="text-muted mb-0">No bills settled yet.</p>`;
        return;
    }

    const bill = bills[0];  // BillListAPI is already ordered by -created_at
    body.innerHTML = `
        <p class="mb-1"><strong>Bill No:</strong> ${bill.bill_number}</p>
        <p class="mb-1"><strong>Table:</strong> ${bill.table_no}</p>
        <p class="mb-1"><strong>Amount:</strong> ₹${bill.total_amount}</p>
        <p class="mb-1"><strong>Payment:</strong> ${bill.payment_method_display}</p>
        <p class="mb-1"><strong>Time:</strong> ${formatDateTime(bill.created_at)}</p>
        ${bill.note ? `<p class="mb-0"><strong>Note:</strong> ${bill.note}</p>` : ""}
    `;
});
</script>
{% endblock body %}
