{% extends "base.html" %}
{% block title %}Orders{% endblock title %}

{% block body %}
<hr class="border border-light border-1">
<div class="container-fluid d-flex justify-content-between align-items-center px-4">
    <h5>Table : <span id="table-no-label">...</span></h5>
    <a class="btn btn-light" href="/orders/">Back</a>
</div>
<hr class="border border-white border-1">

<div class="container-fluid px-4">
    <div class="row align-items-stretch">

        <!-- Category -->
        <div class="col-2">
            <h5>Category</h5>
            <table class="table table-dark table-striped table-borderless table-hover">
                <tbody id="category-rows"></tbody>
            </table>
        </div>
        <div class="col-auto px-0 d-flex align-items-stretch">
            <div class="vr h-100"></div>
        </div>

        <!-- Items -->
        <div class="col">
            <h5>Items</h5>
            <style>
            .hover-card { transition: transform .3s ease, box-shadow .3s ease; box-shadow:0 5px 5px rgba(60, 60, 60, 0.5); }
            .hover-card:hover { transform: translateY(-5px) scale(1.02); box-shadow:0 10px 20px rgb(84, 98, 87); z-index:10; }
            </style>
            <div id="items-body" class="d-flex flex-wrap gap-2"></div>
        </div>
        <div class="col-auto px-0 d-flex align-items-stretch">
            <div class="vr h-100"></div>
        </div>

        <!-- Bill -->
        <div class="col">
            <h5>Bill</h5>
            <table class="table table-dark table-striped table-borderless table-hover">
                <thead class="table-light">
                    <tr><th>Item</th><th>Qty</th><th>Subtotal</th><th></th></tr>
                </thead>
                <tbody id="bill"></tbody>
            </table>
            <div id="bill-error" class="text-danger"></div>

            <hr class="border border-white border-1">

            <h5>Note:</h5>
            <div class="d-flex gap-2">
                <input type="text" id="note-input" class="form-control" placeholder="Add a note...">
            </div>

            <hr class="border border-white border-1">

            <h5>Settle Payment</h5>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-success payment-btn" data-method="CASH">Cash</button>
                <button class="btn btn-outline-primary payment-btn" data-method="CARD">Card</button>
                <button class="btn btn-outline-warning payment-btn" data-method="UPI">UPI</button>
            </div>
        </div>
    </div>
</div>

<script>
const TABLE_ID = {{ table_id }};
const CSRF_TOKEN = "{{ csrf_token }}";
let ORDER_ID = null;

function apiPost(url, body) {
    return fetch(url, {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": CSRF_TOKEN,
        },
        body: JSON.stringify(body || {})
    }).then(res => res.json());
}

function apiGet(url) {
    return fetch(url, {
        headers: { "X-CSRFToken": CSRF_TOKEN }
    }).then(res => res.json());
}

function refreshBill(data) {
    let tbody = document.getElementById("bill");
    tbody.innerHTML = "";

    if (!data.items || data.items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center text-light">No items yet</td></tr>`;
    }

    (data.items || []).forEach(item => {
        const subtotal = parseFloat(item.subtotal);
        tbody.innerHTML += `
            <tr>
                <td>${item.item_name} (${item.size_display})</td>
                <td>
                    <button class="btn btn-sm btn-outline-secondary qty-btn" data-id="${item.id}" data-action="dec">-</button>
                    ${item.quantity}
                    <button class="btn btn-sm btn-outline-secondary qty-btn" data-id="${item.id}" data-action="inc">+</button>
                </td>
                <td>₹${subtotal.toFixed(2)}</td>
                <td><button class="btn btn-sm btn-outline-danger remove-btn" data-id="${item.id}">&times;</button></td>
            </tr>`;
    });

    const total = parseFloat(data.total || 0);
    tbody.innerHTML += `<tr class="table-primary"><th colspan="2">Total</th><th colspan="2">₹${total.toFixed(2)}</th></tr>`;
    document.getElementById("bill-error").innerText = "";

    document.querySelectorAll(".qty-btn").forEach(btn => {
        btn.onclick = () => apiPost(`/api/order-items/${btn.dataset.id}/update/`, { action: btn.dataset.action }).then(refreshBill);
    });
    document.querySelectorAll(".remove-btn").forEach(btn => {
        btn.onclick = () => apiPost(`/api/order-items/${btn.dataset.id}/update/`, { action: "remove" }).then(refreshBill);
    });
}

function loadCategories() {
    apiGet('/api/categories/').then(data => {
        const categories = data.results || data;
        const tbody = document.getElementById('category-rows');
        tbody.innerHTML = "";
        categories.forEach(cat => {
            tbody.innerHTML += `<tr class="category-row" data-id="${cat.id}" style="cursor:pointer;"><td>${cat.name}</td></tr>`;
        });

        document.querySelectorAll(".category-row").forEach(row => {
            row.addEventListener("click", function () {
                loadItemsForCategory(this.dataset.id);
            });
        });
    });
}

function loadItemsForCategory(categoryId) {
    apiGet(`/api/menu-items/?category=${categoryId}&active_only=true`)
    .then(data => {
        const items = data.results || data;
        let tbody = document.getElementById("items-body");
        tbody.innerHTML = "";
        items.forEach(item => {
            let variants = item.variants.map(v =>
                `<button class="btn btn-sm btn-outline-success variant-btn m-1" data-variant-id="${v.id}">${v.size_display} - ₹${v.price}</button>`
            ).join("");
            tbody.innerHTML += `
                <div class="card hover-card m-1" style="width:30%;">
                    <div class="card-header text-center fw-bold">${item.name}</div>
                    <div class="card-body text-center">${variants}</div>
                </div>`;
        });
        document.querySelectorAll(".variant-btn").forEach(btn => {
            btn.onclick = () => apiPost(`/api/orders/${ORDER_ID}/add-item/`, { variant_id: btn.dataset.variantId }).then(refreshBill);
        });
    });
}

document.querySelectorAll(".payment-btn").forEach(btn => {
    btn.onclick = function () {
        if (!confirm(`Settle bill with ${this.dataset.method}?`)) return;

        const note = document.getElementById("note-input").value;

        apiPost(`/api/orders/${ORDER_ID}/settle/`, { payment_method: this.dataset.method, note: note })
        .then(data => {
            if (data.error) {
                document.getElementById("bill-error").innerText = data.error;
                showMessage(data.error, 'danger');
            } else {
                sessionStorage.setItem('flash_message', `Order settled. Bill Number: ${data.bill_number}`);
                window.location.href = "/orders/";
            }
        });
    };
});

// Bootstrap: open/reuse the order for this table, then load everything else
apiPost(`/api/tables/${TABLE_ID}/order/`).then(order => {
    ORDER_ID = order.id;
    document.getElementById('table-no-label').innerText = order.table_no;
    refreshBill(order);
    loadCategories();
});

apiPost(`/api/orders/${ORDER_ID}/settle/`, { payment_method: this.dataset.method, note: note })
.then(data => {
    if (data.error) {
        document.getElementById("bill-error").innerText = data.error;
        showMessage(data.error, 'danger');
    } else {
        showMessage(`Order settled. Bill Number: ${data.bill_number}`);
        window.location.href = "/orders/";
    }
});
</script>
{% endblock body %}
