{% extends "base.html" %}
{% block title %}Manage Items{% endblock title %}
{% block body %}
<hr class="border border-white border-1">
<div class="container-fluid d-flex justify-content-between align-items-center px-4">
    <h5>Manage Items</h5>
    <a class="btn btn-light" href="/additems">+ New Items</a>
</div>
<hr class="border border-white border-1">

<div class="container-fluid px-4">
    <div class="container my-4 mx-auto">
    <table class="table table-dark table-bordered table-striped">
        <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">Item Name</th>
                <th scope="col">Category Name</th>
                <th scope="col">Price</th>
                <th scope="col">Status</th>
                <th scope="col">Operations</th>
            </tr>
        </thead>
        <tbody id="menuitems-rows"></tbody>
    </table>
    </div>
</div>

<script>
const CSRF_TOKEN = "{{ csrf_token }}";

function apiGet(url) {
    return fetch(url, { headers: { 'X-CSRFToken': CSRF_TOKEN } }).then(r => r.json());
}
function apiPost(url, body) {
    return fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
        body: JSON.stringify(body || {})
    }).then(r => r.json());
}



function loadMenuItems() {
    apiGet('/api/menu-items/').then(data => renderMenuItems(data.results || data));
}

function formatPrice(variants) {
    if (!variants || variants.length === 0) return "—";
    // If there's only one variant and it's "Default", just show the price, no label
    if (variants.length === 1 && variants[0].size_display === "Default") {
        return `₹${variants[0].price}`;
    }
    return variants.map(v => `₹${v.price} (${v.size_display})`).join(", ");
}

function renderMenuItems(menuitems) {
    const tbody = document.getElementById('menuitems-rows');
    tbody.innerHTML = "";

    if (menuitems.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center text-light">No items yet</td></tr>`;
        return;
    }

    menuitems.forEach((itm, i) => {
        tbody.innerHTML += `
            <tr>
                <th>${i + 1}</th>
                <td>${itm.name}</td>
                <td>${itm.category_name}</td>
                <td>${formatPrice(itm.variants)}</td>
                <td class="${itm.is_active ? 'text-success' : 'text-danger'}">${itm.is_active ? 'Active' : 'Inactive'}</td>
                <td>
                    <a href="/edititem/${itm.id}/" class="btn btn-sm btn-outline-primary">Edit</a>
                    <button class="btn btn-sm btn-outline-danger ms-1" onclick="deleteItem(${itm.id}, '${itm.name.replace(/'/g, "\\'")}')">Delete</button>
                </td>
            </tr>`;
    });
}

function deleteItem(id, name) {
    if (!confirm(`Delete ${name}?`)) return;
    apiPost(`/api/menu-items/${id}/delete/`).then(() => loadMenuItems());
}

loadMenuItems();
</script>
{% endblock body %}
